# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME

# --- Fonts (JetBrainsMono Nerd Font for Starship icons) ---
# NOTE: non-Mono variant = full-size icons. The Mono variant squeezes
# Nerd glyphs into 1 cell which makes eza/starship icons look tiny.
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
disable_ligatures never

# --- Depth & spacing ---
window_padding_width 10
single_window_padding_width 12
background_opacity 1.0
cursor_shape beam
cursor_blink_interval 0.5

# --- Tabs: continued rounded pills (not square) + handy keys ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align center
tab_bar_min_tabs 1
tab_bar_margin_height 4
tab_bar_background none
tab_title_template "{title}"
tab_title_max_length 22
tab_activity_symbol "•"
active_tab_font_style bold
inactive_tab_font_style normal
# Rounded filled pills: bright purple active, subtle dark inactive
active_tab_background #bd93f9
active_tab_foreground #282a36
inactive_tab_background #44475a
inactive_tab_foreground #f8f8f2
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+r set_tab_title