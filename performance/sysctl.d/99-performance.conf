# Performance sysctl - works on both Debian/Zorin and Arch
# Low swappiness for 13Gi+ RAM + zram, keep cache, reduce dirty writeback
vm.swappiness=10
vm.vfs_cache_pressure=50
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.max_map_count=262144
# Network + FS
fs.inotify.max_user_watches=524288
kernel.sched_autogroup_enabled=0
