"$schema" = 'https://starship.rs/config-schema.json'

# Dracula chain (powerline connected) — no clock
# ~/.config/starship.toml
add_newline = true
continuation_prompt = "[∙](fg:comment)┆ "
palette = 'dracula'

format = """
[](purple)\
$os\
$username\
[](bg:pink fg:purple)\
$directory\
[](bg:yellow fg:pink)\
$git_branch\
$git_status\
[](fg:yellow bg:currentline)\
$nodejs\
$python\
$rust\
$golang\
$c\
$bun\
$php\
$java\
$kotlin\
$haskell\
$lua\
$package\
$conda\
$docker_context\
$jobs\
$status\
$cmd_duration\
[ ](fg:currentline)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:purple fg:background"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint= "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "a"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
Zorin = "󰌽"

[username]
show_always = true
style_user = "bg:purple fg:background"
style_root = "bg:red fg:foreground"
format = '[ $user]($style)'

[directory]
style = "bg:pink fg:background"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "󰋞 ~"
read_only = " 󰌾"
read_only_style = "bg:pink fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
truncation_length = 24
truncation_symbol = "…"
format = '[[ $symbol $branch ](fg:background bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:background bg:yellow)]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"
renamed = "»${count}"
stashed = "\\$${count}"

[nodejs]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:green bg:currentline)]($style)'

[python]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version)(\\(#$virtualenv\\)) ](fg:yellow bg:currentline)]($style)'

[rust]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:orange bg:currentline)]($style)'

[golang]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:cyan bg:currentline)]($style)'

[c]
symbol = " "
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:cyan bg:currentline)]($style)'

[bun]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:foreground bg:currentline)]($style)'

[php]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:pink bg:currentline)]($style)'

[java]
symbol = " "
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:red bg:currentline)]($style)'

[kotlin]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:orange bg:currentline)]($style)'

[haskell]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:purple bg:currentline)]($style)'

[lua]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:cyan bg:currentline)]($style)'

[package]
symbol = "󰏗"
style = "bg:currentline"
format = '[[ $symbol ($version) ](fg:foreground bg:currentline)]($style)'

[conda]
symbol = "  "
style = "fg:green bg:currentline"
format = '[ $symbol$environment ]($style)'
ignore_base = false

[docker_context]
symbol = ""
style = "bg:currentline"
format = '[[ $symbol ($context) ](fg:cyan bg:currentline)]($style)'

[jobs]
threshold = 1
symbol_threshold = 1
number_threshold = 1
symbol = ""
style = "bg:currentline"
format = '[[ $symbol$number ](fg:purple bg:currentline)]($style)'

[status]
disabled = false
style = "bg:currentline fg:red"
symbol = "✗"
format = '[[ $symbol $status ](fg:red bg:currentline)]($style)'

[cmd_duration]
min_time = 2000
show_milliseconds = true
format = '[[ 󰔟 took $duration ](fg:foreground bg:currentline)]($style)'
style = "bg:currentline"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[time]
disabled = true

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[╰─❯](bold fg:purple)'
error_symbol = '[╰─❯](bold fg:red)'
vimcmd_symbol = '[╰─❮](bold fg:green)'
vimcmd_replace_one_symbol = '[╰─❮](bold fg:purple)'
vimcmd_replace_symbol = '[╰─❮](bold fg:purple)'
vimcmd_visual_symbol = '[╰─❮](bold fg:yellow)'

[palettes.dracula]
background = "#282a36"
currentline = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
